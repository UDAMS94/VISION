<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VISION">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
  <title>강의 상세 | VISION 클래스</title>
</head>
<body data-page="courses">
  <main>
    <section class="course-hero" id="course-hero">
      <div class="container">
        <div id="course-hero-text"></div>
      </div>
    </section>

    <section class="section" style="padding-top:36px">
      <div class="container detail-layout">
        <div>
          <h2 style="font-size:22px">과정 소개</h2>
          <p class="muted" id="course-desc" style="margin-top:10px"></p>
          <h3 style="font-size:18px;margin-top:28px">이 과정을 마치면</h3>
          <ul class="outcomes" id="outcomes"></ul>
          <div class="section-head" style="margin-bottom:14px">
            <div><h2 style="font-size:22px">커리큘럼</h2><p id="curriculum-count"></p></div>
          </div>
          <div id="curriculum"></div>
        </div>
        <aside>
          <div class="enroll-card" id="enroll-card" style="position:sticky;top:calc(var(--header-h) + 16px)"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
