<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VISION">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
  <title>강의 시청 | VISION 클래스</title>
</head>
<body data-page="watch">
  <main class="container watch-layout">
    <div>
      <div class="player" id="player"></div>
      <div class="watch-info">
        <div class="crumbs" id="watch-crumbs"></div>
        <h1 id="watch-title"></h1>
        <div class="watch-actions">
          <a class="btn btn-ghost btn-sm" id="prev-btn">← 이전</a>
          <button class="btn btn-primary" id="done-btn" type="button">✅ 오늘 강의 완료</button>
          <a class="btn btn-ghost btn-sm" id="next-btn">다음 →</a>
        </div>
        <div id="watch-extra">
          <div class="mission">
            <h3>🎯 오늘의 미션</h3>
            <p id="mission-text"></p>
          </div>
          <div class="note">
            <h3>📝 나의 메모</h3>
            <textarea id="note" placeholder="오늘 강의에서 느낀 점, 실천한 내용을 적어보세요. (이 기기에 자동 저장됩니다)"></textarea>
            <div class="saved" id="note-saved"></div>
          </div>
        </div>
      </div>
    </div>
    <aside class="side-panel">
      <header id="side-head"></header>
      <div class="scroll" id="side-list"></div>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
